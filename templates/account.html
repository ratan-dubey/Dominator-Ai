<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Dominator AI</title>
    <link rel="shortcut icon" type="x-icon" href="static\websiteimages\dominatorai.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <a href="{{ url_for('chat') }}" class="back-to-chat-btn">
        <i class="fas fa-arrow-left"></i> Back to Chat
    </a>
    <div class="hero-section" style="background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));">
        <div class="glass-card fade-in" style="max-width: 600px; width: 90%; margin: 0 auto; padding: 40px;">
            <div style="text-align: center; margin-bottom: 30px;">
                <img src="{{ url_for('static', filename='uploads/' + user.profile_pic) if user.profile_pic else url_for('static', filename='images/default-avatar.png') }}" 
                     class="profile-pic" 
                     style="width: 150px; height: 150px; margin-bottom: 20px;">
                <h2 style="color: white; margin-bottom: 10px;">{{ user.username }}</h2>
                <p style="color: rgba(255, 255, 255, 0.8);">{{ user.email }}</p>
            </div>

            <form method="POST" action="{{ url_for('update_profile') }}" enctype="multipart/form-data">
                <div style="text-align: center; margin-bottom: 20px;">
                    <img id="profilePreview" src="{{ url_for('static', filename='uploads/' + user.profile_pic) if user.profile_pic else url_for('static', filename='images/default-avatar.png') }}" 
                         class="profile-pic-preview" 
                         alt="Profile Preview">
                    <input type="file" id="profileImageInput" name="profile_pic" accept="image/*" style="display: none;">
                    <button type="button" class="btn" onclick="document.getElementById('profileImageInput').click()" 
                            style="background: var(--accent-color);">
                        Update Profile Picture
                    </button>
                </div>

                <input type="text" name="username" class="input-field" placeholder="Username" value="{{ user.username }}" required>
                <input type="email" name="email" class="input-field" placeholder="Email" value="{{ user.email }}" required>
                <input type="password" name="current_password" class="input-field" placeholder="Current Password">
                <input type="password" name="new_password" class="input-field" placeholder="New Password">
                <input type="password" name="confirm_password" class="input-field" placeholder="Confirm New Password">
                
                <button type="submit" class="btn" style="width: 100%; margin-bottom: 20px;">Update Profile</button>
            </form>

            <a href="{{ url_for('logout') }}" class="btn" style="width: 100%; background: #ff6b6b;">Logout</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
