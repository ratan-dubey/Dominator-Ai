<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dominator AI</title>
    <link rel="shortcut icon" type="x-icon" href="static\websiteimages\dominatorai.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="hero-section" style="background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));">
        <div class="glass-card fade-in" style="max-width: 400px; width: 90%; margin: 0 auto; padding: 40px;">
            <h2 style="text-align: center; margin-bottom: 30px; color: white;">Login to Dominator AI</h2>
            
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div style="color: #ff6b6b; margin-bottom: 20px; text-align: center;">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <input type="email" name="email" class="input-field" placeholder="Email" required>
                <input type="password" name="password" class="input-field" placeholder="Password" required>
                <button type="submit" class="btn" style="width: 100%;">Login</button>
            </form>

            <p style="text-align: center; margin-top: 20px; color: white;">
                Don't have an account? <a href="{{ url_for('signup') }}" style="color: var(--accent-color); text-decoration: none;">Sign Up</a>
            </p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
