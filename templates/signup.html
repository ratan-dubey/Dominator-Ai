<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Dominator AI</title>
    <link rel="shortcut icon" type="x-icon" href="static\websiteimages\dominatorai.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="hero-section" style="background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));">
        <div class="glass-card fade-in" style="max-width: 500px; width: 90%; margin: 0 auto; padding: 40px;">
            <h2 style="text-align: center; margin-bottom: 30px; color: white;">Create Your Account</h2>
            
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div style="color: #ff6b6b; margin-bottom: 20px; text-align: center;">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('signup') }}" enctype="multipart/form-data">
                <div style="text-align: center; margin-bottom: 20px;">
                    <img src="{{ url_for('static', filename='images/default-avatar.png') }}" 
                         class="profile-pic-preview" 
                         style="width: 100px; height: 100px; border-radius: 50%; margin-bottom: 10px;">
                    <input type="file" id="profile-pic" name="profile_pic" accept="image/*" style="display: none;">
                    <button type="button" class="btn" onclick="document.getElementById('profile-pic').click()" 
                            style="background: var(--accent-color); margin-bottom: 20px;">
                        Upload Profile Picture
                    </button>
                </div>

                <input type="text" name="username" class="input-field" placeholder="Username" required>
                <input type="email" name="email" class="input-field" placeholder="Email" required>
                <input type="password" name="password" class="input-field" placeholder="Password" required>
                <input type="password" name="confirm_password" class="input-field" placeholder="Confirm Password" required>
                
                <button type="submit" class="btn" style="width: 100%;">Sign Up</button>
            </form>

            <p style="text-align: center; margin-top: 20px; color: white;">
                Already have an account? <a href="{{ url_for('login') }}" style="color: var(--accent-color); text-decoration: none;">Login</a>
            </p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
